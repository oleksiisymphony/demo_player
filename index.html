<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wowza WebRTC Player</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            max-width: 900px;
            margin: 0 auto;
        }

        #wowza-player {
            width: 100%;
            padding-top: 56.25%;
            height: 0px;
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #wowza-player video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .audio-controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 16px 24px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .btn-play {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(13, 110, 253, 0.4);
        }

        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 110, 253, 0.5);
            background: linear-gradient(135deg, #3d8bfd 0%, #0d6efd 100%);
        }

        .btn-play:active {
            transform: translateY(0);
        }

        .volume-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .volume-icon {
            color: rgba(255, 255, 255, 0.8);
            font-size: 20px;
        }

        .volume-slider {
            flex: 1;
            height: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.2);
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(13, 110, 253, 0.5);
            transition: transform 0.2s ease;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .volume-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 10px rgba(13, 110, 253, 0.5);
        }

        .volume-slider::-webkit-slider-runnable-track {
            background: linear-gradient(to right, #0d6efd var(--volume-percent, 100%), rgba(255, 255, 255, 0.2) var(--volume-percent, 100%));
            border-radius: 4px;
            height: 8px;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
        }

        .status-badge.connected {
            background: rgba(25, 135, 84, 0.2);
            color: #75b798;
        }

        .status-badge.playing {
            background: rgba(13, 110, 253, 0.2);
            color: #6ea8fe;
        }
    </style>
</head>
<body>
    <script src='https://www.wowza.com/downloads/rts-sdk/wowza.umd.js'></script>
    <script src="player.js"></script>

    <div class="player-container">
        <div id="wowza-player">
            <video controls muted playsinline></video>
        </div>
    </div>

    <!-- iOS WebAudio wiring and volume controls helper -->
    <script src="ios-waudio-fix.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
